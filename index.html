<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مغامرات غرناطة في عالم TIMSS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <div class="top"><span>مدرسة غرناطة الابتدائية للبنات</span><span class="badge">TIMSS</span></div>

    <section id="reg" class="card hide">
      <h1>مغامرات غرناطة في عالم TIMSS</h1>
      <p class="sub">مرحباً بك! سجّلي بياناتك مرة واحدة فقط</p>
      <label class="f" for="name">اسم الطالبة</label>
      <input type="text" id="name" autocomplete="off" placeholder="الاسم الثلاثي">
      <label class="f" for="sec">الصف: الرابع الابتدائي — اكتبي الفرقة</label>
      <input type="text" id="sec" autocomplete="off" placeholder="مثال: 4/2">
      <button id="save">حفظ والدخول</button>
    </section>

    <section id="home" class="card hide">
      <div class="hello"><span id="hi"></span><button class="ghost small" id="logout">تغيير الطالبة</button></div>
      <h1>اختاري المادة</h1>
      <p class="sub">اختاري المادة التي تريدين خوض تحدياتها</p>
      <div class="grid">
        <button class="tile" style="--c:#2f7de1" data-s="math"><span>🧮</span>الرياضيات<small>مغامرات الرياضيات</small></button>
        <button class="tile" style="--c:#1fa67a" data-s="sci"><span>🔬</span>العلوم<small>مغامرات العلوم</small></button>
      </div>
    </section>

    <section id="menu" class="card hide">
      <button class="ghost small" id="toHome">🏠 العودة للصفحة الرئيسية</button>
      <h1 id="mtitle"></h1>
      <p class="sub">اختاري اللعبة أو الاختبار الذي تريدينه</p>
      <div class="grid" id="tiles"></div>
    </section>

    <section id="quiz" class="card hide">
      <button class="ghost small" id="toMenu">العودة للقائمة</button>
      <h2 id="count"></h2>
      <div class="bar"><i id="fill"></i></div>
      <div class="q" id="qtext"></div>
      <div id="opts"></div>
      <div id="fb" class="fb hide"></div>
      <button id="next" disabled>تحقق من الإجابة</button>
    </section>

    <section id="res" class="card hide">
      <h1 id="title"></h1>
      <div class="ring" id="ring"><span id="pct"></span></div>
      <div class="big" id="score"></div>
      <div class="msg" id="note"></div>
      <div class="status" id="status"></div>
      <button class="alt" id="again">إعادة المحاولة</button>
      <button id="backMenu">العودة للقسم</button>
      <button class="ghost" id="backHome">العودة للصفحة الرئيسية</button>
    </section>

    <div class="foot">المعلمة: شيخة آل سعيد</div>
  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
